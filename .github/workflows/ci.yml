name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  # Required check: deterministic verification floor (SYMPH-356).
  # Branch protection / merge queue should require this job ("test").
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Guard implementation correctness is blocking even while the measured
      # architecture findings remain report-only (SYMPH-1073).
      - name: Architecture guard self-tests
        run: pnpm architecture:test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # SYMPH-352: the suite has two known teardown flakes — an unhandled
      # rejection ("Codex app-server process is not writable") fires after all
      # tests pass, so vitest exits 1 with 0 failed tests. Retry the full suite
      # once so a teardown flake does not fail the required check. Drop the
      # retry once SYMPH-352 fixes the teardown.
      - name: Test
        run: pnpm test || pnpm test

      - name: Build
        run: pnpm build

      - name: Codex headless feature-flag smoke
        run: pnpm smoke:codex-headless

      - name: Verify npm package contents
        run: npm pack --dry-run

  # SYMPH-1073: mechanical anti-sprawl measurements opened 2026-07-09.
  # Keep report-only through 2026-07-23, then inspect the actual PR stream and
  # propose enforcement only for gates whose thresholds show no false positives.
  architecture-report:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated CLI help blocks
        run: pnpm build && pnpm docs:check

      - name: Run anti-sprawl report
        env:
          ARCHITECTURE_CHECK_BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE_REF="$ARCHITECTURE_CHECK_BASE_REF"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD^"
          fi
          node scripts/architecture/check-file-size-ratchet.mjs --base "$BASE_REF"
          node scripts/architecture/check-god-files.mjs --base "$BASE_REF"
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/architecture/check-god-files.mjs --full-set
          fi
          node scripts/architecture/check-env-registry.mjs
          node scripts/architecture/check-dead-exports.mjs

  # Warn-only during calibration (SYMPH-356): new/changed lines in src/ must
  # be exercised by tests (>= 70%). Flip to enforcing by removing
  # continue-on-error after the calibration week, then mark it required.
  diff-coverage:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the merge-base with the target branch resolves.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same SYMPH-352 teardown-flake retry as the test job; coverage output
      # is written before the flaky teardown, but a clean exit keeps the job
      # signal honest.
      - name: Run tests with coverage
        run: pnpm exec vitest run --coverage || pnpm exec vitest run --coverage

      - name: Check diff coverage
        env:
          # In the merge queue, diff against this group entry's base (main +
          # PRs ahead in the queue) so a PR is not blamed for queued changes.
          DIFF_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: node scripts/ci/diff-coverage.mjs --base "$DIFF_BASE" --threshold 70

  # Delta security scan (SYMPH-356): semgrep with --baseline-commit, so only
  # findings introduced by this PR's diff fail the job. Pre-existing findings
  # (the backlog tracked by Dependabot/code scanning) never block here.
  security-delta:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: semgrep checks out the baseline commit internally.
          fetch-depth: 0

      - name: Install semgrep
        run: pipx install semgrep

      - name: Semgrep delta scan (new findings only)
        env:
          DIFF_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: |
          BASELINE="$(git merge-base "$DIFF_BASE" HEAD)"
          echo "Baseline commit: $BASELINE"
          semgrep scan \
            --config p/default \
            --config p/typescript \
            --baseline-commit "$BASELINE" \
            --error \
            --text
