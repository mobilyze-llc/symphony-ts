name: Post-Merge Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        id: lint
        run: pnpm lint

      - name: Typecheck
        id: typecheck
        if: always() && steps.lint.outcome != 'cancelled'
        run: pnpm typecheck

      - name: Test
        id: test
        if: always() && steps.typecheck.outcome != 'cancelled'
        run: pnpm test

      - name: Build
        id: build
        if: always() && steps.test.outcome != 'cancelled'
        run: pnpm build

      - name: Record calver bump follow-up
        id: calver
        if: success()
        run: node scripts/post-merge-gate.mjs calver-plan --summary

      - name: Create Linear issue on failure
        if: failure()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          STEP_LINT_OUTCOME: ${{ steps.lint.outcome }}
          STEP_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          STEP_TEST_OUTCOME: ${{ steps.test.outcome }}
          STEP_BUILD_OUTCOME: ${{ steps.build.outcome }}
          STEP_CALVER_OUTCOME: ${{ steps.calver.outcome }}
        run: |
          PR_NUMBER=$(git log -1 --pretty=%B | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          export POST_MERGE_GATE_PR_NUMBER="${PR_NUMBER}"
          node scripts/post-merge-gate.mjs linear-failure-issue
